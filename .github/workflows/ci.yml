name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: csm_silks
          POSTGRES_USER: csm_user
          POSTGRES_PASSWORD: csm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csm_user -d csm_silks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: 'True'
      DB_NAME: csm_silks
      DB_USER: csm_user
      DB_PASSWORD: csm_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      E_INVOICE_PROVIDER: disabled
      SMS_PROVIDER: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Secret scan
        run: python scripts/check_no_secrets.py --self-test

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Django deployment security check
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-production-secret-key-with-enough-entropy-for-deploy-checks
          ALLOWED_HOSTS: api.vastrabook.in
          CORS_ALLOW_ALL_ORIGINS: 'False'
          CORS_ALLOWED_ORIGINS: https://app.vastrabook.in
          CSRF_TRUSTED_ORIGINS: https://app.vastrabook.in
          DEMO_SESSION_ENABLED: 'False'
          SMS_PROVIDER: sms_gateway
          SMS_PROVIDER_API_URL: https://sms.example.test/send
          SMS_PROVIDER_API_TOKEN: ci-sms-token
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: ci-resend-token
          RESEND_FROM_EMAIL: reports@example.com
          E_INVOICE_PROVIDER: einvoice_gateway
          E_INVOICE_API_URL: https://einvoice.example.test
          E_INVOICE_API_TOKEN: ci-einvoice-token
          E_WAY_BILL_PROVIDER: eway_gateway
          E_WAY_BILL_API_URL: https://eway.example.test
          E_WAY_BILL_API_TOKEN: ci-eway-token
          PAYMENT_GATEWAY_PROVIDER: razorpay
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: ci-razorpay-secret
          RAZORPAY_WEBHOOK_SECRET: ci-razorpay-webhook-secret
          SHIPPING_PROVIDER: shiprocket
          SHIPROCKET_API_URL: https://shiprocket.example.test
          SHIPROCKET_EMAIL: ship@example.com
          SHIPROCKET_PASSWORD: ci-shiprocket-password
          SHIPROCKET_PICKUP_LOCATION: Primary
          WHATSAPP_PROVIDER: gupshup
          GUPSHUP_API_URL: https://gupshup.example.test
          GUPSHUP_API_KEY: ci-gupshup-token
          GUPSHUP_APP_NAME: VastraBook
          GUPSHUP_SOURCE_NUMBER: '919000000000'
          MESSAGING_WEBHOOK_SECRET: ci-messaging-webhook-secret
          SECURE_SSL_REDIRECT: 'True'
          SESSION_COOKIE_SECURE: 'True'
          CSRF_COOKIE_SECURE: 'True'
          SECURE_HSTS_SECONDS: '31536000'
          SECURE_HSTS_INCLUDE_SUBDOMAINS: 'True'
          SECURE_HSTS_PRELOAD: 'True'
          SECURE_REFERRER_POLICY: strict-origin-when-cross-origin
          X_FRAME_OPTIONS: DENY
        run: python manage.py check --deploy --fail-level WARNING

      - name: Verify deployment smoke checker syntax
        run: python -m py_compile deploy/smoke_check.py

      - name: Verify migration files are current
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: >
          python manage.py test
          apps.accounts
          apps.accounting
          apps.payments
          apps.sales
          apps.purchases
          apps.staff
          apps.business_settings
          apps.business_tools
          apps.items
          apps.parties
          --noinput
